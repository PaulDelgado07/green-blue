global:
  scrape_interval: 5s

scrape_configs:

  - job_name: "blue-node"
    static_configs:
      - targets: ["host.docker.internal:9100"]

  - job_name: "green-node"
    static_configs:
      - targets: ["host.docker.internal:9101"]

  - job_name: "blue-app"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: "green-app"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8001"]